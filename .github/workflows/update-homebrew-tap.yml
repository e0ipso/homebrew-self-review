name: update homebrew tap

on:
  schedule:
    # Hourly poll of upstream releases. The app repository does not notify
    # this tap when it publishes, so the tap has to look for itself.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Release tag to publish, for example v1.38.0. Leave empty to publish
          the newest upstream release whose macOS and Linux ZIPs both exist.
        required: false
  repository_dispatch:
    types:
      - self-review-release

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_REPOSITORY: e0ipso/self-review
    steps:
      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          # A PAT makes the bump commit run tap CI; github.token pushes do not
          # trigger other workflows. Both can push.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          # Read the current branch head even if this run waited in the queue.
          ref: ${{ github.ref }}

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail

          # Emits "<tag> <darwin sha256> <linux sha256>" for each release that
          # is final and carries both tap assets with digests. Skips the rest.
          # Keep jq's interpolation literal until gh evaluates the filter.
          # shellcheck disable=SC2016
          complete_release='
            select((.draft | not) and (.prerelease | not))
            | select(.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))
            | .tag_name as $tag
            | ($tag | ltrimstr("v")) as $version
            | ([.assets[] | {(.name): (.digest // "" | sub("^sha256:"; ""))}] | add // {}) as $digests
            | ($digests["Self.Review-darwin-arm64-\($version).zip"] // "") as $darwin
            | ($digests["Self.Review-linux-x64-\($version).zip"] // "") as $linux
            | select(($darwin | test("^[0-9a-f]{64}$")) and ($linux | test("^[0-9a-f]{64}$")))
            | "\($tag) \($darwin) \($linux)"
          '

          current_version="$(sed -n 's/^  version "\([^"]*\)"$/\1/p' Casks/self-review.rb)"
          test -n "$current_version"

          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo "release_tag must look like v1.38.0, got '$REQUESTED_TAG'" >&2
              exit 1
            fi
            resolved=""
            for attempt in {1..60}; do
              resolved="$(gh api "repos/${APP_REPOSITORY}/releases/tags/${REQUESTED_TAG}" --jq "$complete_release" 2>/dev/null || true)"
              [[ -n "$resolved" ]] && break
              echo "Waiting for both ZIP assets on ${REQUESTED_TAG}, attempt ${attempt}/60"
              sleep 30
            done
            if [[ -z "$resolved" ]]; then
              echo "Timed out waiting for ${REQUESTED_TAG} assets with sha256 digests" >&2
              exit 1
            fi
          else
            # A release can exist without assets when the upstream release job
            # dies between tagging and uploading. Take the highest complete one.
            resolved="$(gh api --paginate "repos/${APP_REPOSITORY}/releases?per_page=100" --jq ".[] | $complete_release" | sort -V | tail -n 1)"
            if [[ -z "$resolved" ]]; then
              echo "No upstream release has both ZIP assets; nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          read -r tag darwin_sha linux_sha <<< "$resolved"
          version="${tag#v}"

          if [[ -z "$REQUESTED_TAG" ]] && [[ "$(printf '%s\n%s\n' "$current_version" "$version" | sort -V | tail -n 1)" == "$current_version" ]]; then
            echo "Tap is at ${current_version}; newest complete upstream release is ${version}. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing self-review ${version} (tap currently at ${current_version})"
          {
            echo "skip=false"
            echo "tag=$tag"
            echo "version=$version"
            echo "darwin_sha=$darwin_sha"
            echo "linux_sha=$linux_sha"
          } >> "$GITHUB_OUTPUT"

      # Homebrew setup replaces the workspace with its own tap checkout.
      # Restore this branch and its push credentials before changing files.
      - name: Set up Homebrew
        if: steps.release.outputs.skip != 'true'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Restore tap checkout
        if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          ref: ${{ github.ref }}

      - name: Update package definitions
        if: steps.release.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DARWIN_SHA256: ${{ steps.release.outputs.darwin_sha }}
          LINUX_SHA256: ${{ steps.release.outputs.linux_sha }}
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          version = ENV.fetch("VERSION")
          darwin_sha = ENV.fetch("DARWIN_SHA256")
          linux_sha = ENV.fetch("LINUX_SHA256")

          cask_path = "Casks/self-review.rb"
          cask = File.read(cask_path)
          cask.gsub!(/version "[^"]+"/, %(version "#{version}"))
          cask.gsub!(/sha256 "[0-9a-f]{64}"/, %(sha256 "#{darwin_sha}"))
          File.write(cask_path, cask)

          formula_path = "Formula/self-review.rb"
          formula = File.read(formula_path)
          formula.gsub!(
            %r{url "https://github\.com/e0ipso/self-review/releases/download/v[^/]+/Self\.Review-linux-x64-[^"]+\.zip"},
            %(url "https://github.com/e0ipso/self-review/releases/download/v#{version}/Self.Review-linux-x64-#{version}.zip")
          )
          formula.gsub!(/sha256 "[0-9a-f]{64}"/, %(sha256 "#{linux_sha}"))
          File.write(formula_path, formula)
          RUBY
          git diff

      - name: Disable Homebrew API
        if: steps.release.outputs.skip != 'true'
        run: echo "HOMEBREW_NO_INSTALL_FROM_API=1" >> "$GITHUB_ENV"

      - name: Run tap checks
        if: steps.release.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/e0ipso/homebrew-self-review"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$PWD" "$tap_dir"
          brew audit --cask --strict e0ipso/self-review/self-review
          brew style --cask e0ipso/self-review/self-review
          brew audit --formula --strict e0ipso/self-review/self-review
          brew style --formula e0ipso/self-review/self-review

      - name: Commit and push
        if: steps.release.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Tap already up to date for self-review ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/self-review.rb Formula/self-review.rb
          git commit -m "self-review ${VERSION}"
          git push
